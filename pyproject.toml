[project]
name = "task-management-api"
version = "0.1.0"
description = "Task Management REST API built with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "aiosqlite>=0.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

